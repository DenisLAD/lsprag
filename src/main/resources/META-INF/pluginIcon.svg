<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6DB33F" /> <!-- Spring green -->
            <stop offset="100%" stop-color="#3F7E2A" />
        </linearGradient>
        <filter id="shadow" x="-0.05" y="-0.05" width="1.1" height="1.1">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="2" dy="2"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background circle with gradient -->
    <circle cx="64" cy="64" r="58" fill="url(#bgGrad)" stroke="#fff" stroke-width="2" filter="url(#shadow)"/>

    <!-- Leaf (Spring Boot) -->
    <path d="M64,30 Q74,38 76,48 Q78,58 70,68 Q82,72 80,84 Q78,96 64,98 Q50,96 48,84 Q46,72 58,68 Q50,58 52,48 Q54,38 64,30Z"
          fill="#FFFFFF" opacity="0.95" stroke="#2C5E1A" stroke-width="1.2"/>

    <!-- Magnifying glass lens (over leaf) -->
    <circle cx="74" cy="58" r="14" fill="none" stroke="#2C5E1A" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="74" cy="58" r="10" fill="#F9F9F9" stroke="#2C5E1A" stroke-width="1.5"/>
    <path d="M85 69 L94 78" stroke="#2C5E1A" stroke-width="3" stroke-linecap="round"/>

    <!-- Sparkle (LLM / AI) -->
    <g fill="#FFD966" stroke="#D4A017" stroke-width="0.8">
        <polygon points="92,42 94.5,47 100,47.5 96,51.5 97.5,57 92,53.5 86.5,57 88,51.5 84,47.5 89.5,47 92,42"/>
        <polygon points="48,96 50,101 55,101.5 51,105.5 52.5,111 48,107.5 43.5,111 45,105.5 41,101.5 46,101 48,96"/>
    </g>

    <!-- Code brackets (contextual analysis) -->
    <path d="M44,76 L38,82 L44,88" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M84,76 L90,82 L84,88" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>