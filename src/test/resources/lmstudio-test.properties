# LM Studio Integration Test Configuration
# Set to true to enable LM Studio integration tests
test.lmstudio.enabled=false

# LM Studio endpoint (default: http://localhost:1234/v1/chat/completions)
test.lmstudio.endpoint=http://localhost:1234/v1/chat/completions

# Model name (default: qwen/qwen3.5-9b)
test.lmstudio.model=qwen/qwen3.5-9b

# Timeout in seconds
test.lmstudio.timeout=120
